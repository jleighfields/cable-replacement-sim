# Documented defaults for a full-size run. Sweeps override these from a driver
# script or notebook rather than by editing this file, so what is written here
# stays the one reproducible baseline.
#
# The coupled values below — the technology scales, the install-volume curve,
# the population size, the lateral customer mix and the annual budget — were
# calibrated together by running the population generator, against the targets
# that follow: about 2% of segments fail in the first year under
# run-to-failure, the budget funds roughly 60% of that, and the customers on
# terminal laterals reconcile with the system total. The value-of-lost-load
# figures are still placeholders needing a published source.

simulation:
  n_years: 30
  n_reps: 1000
  seed: 20260902
  start_year: 2026      # Year 0. A segment's age is start_year - install_year,
                        # and every present value is discounted to this year.
                        # Nothing may be installed after it: a negative age
                        # makes both Weibull forms return NaN.
  precision: f64        # The floating width every implementation computes in.
                        # It reaches them as the dtype of the arrays they are
                        # handed, so nothing branches on it. f32 halves the
                        # working set and gives different answers in the dollar
                        # columns; docs/single-precision.md has what it costs
                        # and saves, and where it is worth using.

  # How many replications are computed per batch is deliberately NOT here. It
  # bounds the result arrays and whatever state an implementation holds in
  # flight, and so trades memory against time, but every draw is a function of
  # the key and of a position carrying the replication's index in the whole
  # run, so the batch size changes no number. It is a driver-script argument,
  # optional there because each implementation declares what it wants when
  # nobody names one, and recorded in each run's manifest — as the size that
  # was resolved, beside the thread count and the build profile.

population:
  n_segments: 12_000
  # System-wide customer count, and the denominator for SAIFI and SAIDI. It is
  # NOT the sum over segments: customers are counted downstream of each asset,
  # so a feeder's count already contains the laterals' below it. The figure to
  # sanity-check against is the sum over terminal laterals, since nothing sits
  # downstream of those. Scale this with n_segments or every index moves by the
  # ratio -- a systematic bias, not sampling noise.
  total_customers: 95_000
  customer_types: [residential, commercial, industrial]
  # The length a configured technology scale describes. Only ratios to it
  # matter, so it sets the level and never the spread between classes.
  length_ref_ft: 500.0
  # How strongly length drives failure, as the exponent in
  # (n * (L / L_ref) ** length_exponent) ** (-1 / shape).
  #   1.0 = spatial-Poisson: failure rate proportional to feet of run.
  #   0.0 = failures are per-segment and length does not matter.
  # Sub-linear because a large share of underground faults are at splices,
  # terminations and elbows, which scale with the count of accessories rather
  # than with length. It is also what separates the two three-phase classes
  # from each other, since both carry three conductors.
  length_exponent: 0.5

  # Scale keys on technology, because failure behaviour follows the insulation
  # compound and the vintage. Each pair describes a SINGLE CONDUCTOR at
  # length_ref_ft; the reduction above turns it into the per-segment value, so
  # a three-phase segment lives 3^(-1/shape) as long as an otherwise identical
  # single-phase one -- about 0.82x at these shapes. That ordering comes from
  # the conductor count and cannot be reversed by choosing scales, which is why
  # laterals come out longest-lived.
  #
  # Vintage ranges must partition install_year_range with no gap and no
  # overlap, or a segment resolves to no technology and silently carries
  # whichever parameters the array was initialised with.
  technologies:
    - {name: hmwpe,   vintage: [1965, 1985], weibull: {shape: 6.2, scale: 50.0}}
    - {name: xlpe,    vintage: [1986, 2004], weibull: {shape: 6.5, scale: 57.0}}
    - {name: tr_xlpe, vintage: [2005, 2020], weibull: {shape: 6.8, scale: 65.0}}
  replacement_technology: tr_xlpe   # what a replacement installs

  classes:
    - name: main_feeder
      share: 0.12
      n_conductors: 3
      length_ft:   {dist: lognormal, median: 1200, sigma: 0.45}
      cost_per_ft: 185.0
      # Shape only, overriding the technology default. Conductor size is a
      # second axis technology does not capture: feeder cable is a larger
      # conductor and a different product from the lateral and distribution
      # cable of the same vintage and compound. Longer runs, more accessories
      # and heavier thermal loading spread its failures out, which is a lower
      # shape rather than a shorter scale. Classes naming no shape take their
      # technology's, so distribution and lateral segments of one vintage
      # remain the same cable.
      weibull_shape: 5.5
      customer_mix:
        residential: {dist: lognormal, median: 700, sigma: 0.70}
        commercial:  {dist: lognormal, median: 120, sigma: 0.90}
        industrial:  {dist: lognormal, median: 4,   sigma: 1.10}
    - name: distribution_3ph
      share: 0.33
      n_conductors: 3
      length_ft:   {dist: lognormal, median: 600, sigma: 0.50}
      cost_per_ft: 140.0
      customer_mix:
        residential: {dist: lognormal, median: 85, sigma: 0.80}
        commercial:  {dist: lognormal, median: 9,  sigma: 1.00}
        industrial:  {dist: lognormal, median: 1,  sigma: 1.20}
    - name: lateral_1ph
      share: 0.55
      n_conductors: 1
      length_ft:   {dist: lognormal, median: 350, sigma: 0.60}
      cost_per_ft: 95.0
      customer_mix:
        residential: {dist: lognormal, median: 8,   sigma: 0.85}
        commercial:  {dist: lognormal, median: 1,   sigma: 1.10}
        industrial:  {dist: lognormal, median: 0.4, sigma: 1.30}

  initial_age:
    dist: empirical_install_years
    install_year_range: [1965, 2020]
    # Relative volume of cable STILL IN THE GROUND at each breakpoint, not of
    # cable ever installed: the oldest vintages have been progressively
    # replaced already, so the surviving profile rises toward the present.
    # Linearly interpolated between breakpoints and normalized to a
    # distribution over integer years.
    install_volume:
      1965: 0.002
      1975: 0.077
      1985: 0.214
      1995: 0.395
      2005: 0.613
      2020: 1.0

# The censored failure history the MLE fits. Separate from the population
# above: this table is sized by how many observed failures the recovery test
# needs, not by how large a system is being modeled.
records:
  n_segments: 20_000
  # A prospective follow-up: inventory what is in the ground at
  # monitoring_start, taking install dates from the asset register, then record
  # failures until study_end. The two edges do different things and an episode
  # can meet both. study_end RIGHT-CENSORS at exit: a row with a missing end.
  # monitoring_start LEFT-TRUNCATES at entry: a MISSING ROW. Cable installed
  # 1967 that failed in 1996 and was replaced leaves no row at all here — only
  # its replacement appears, and nothing says it is a replacement. That
  # surviving row is censored at exit and truncated at entry, both at once.
  monitoring_start: 1998
  study_end: 2026

failure:
  conductor_dependence: iid         # iid | shared_frailty (not implemented)

costs:
  emergency_multiplier: 2.5
  mobilization_per_segment: 3_500.0
  escalation_rate: 0.03
  discount_rate: 0.06               # for present-value reporting

budget:
  # Capital available in year 0, escalated annually. Sweeps override this from
  # a driver script -- it is the horizontal axis of the deliverable figure.
  # At these settings it funds about 141 replacements a year against about 240
  # expected failures, so the constraint binds and the policies have something
  # to differ about. That 59% is measured at planned cost on the population
  # mean; the segments that actually fail are longer and dearer than average,
  # so the same budget covers about 36% of the year's failures at planned cost
  # and about 14% of the emergency spend they incur.
  annual: 12_000_000.0
  escalation: 0.03
  # false: emergency work draws a separate operations bucket, so the sweep axis
  # stays purely planned capital. true charges it against this budget BEFORE
  # the planned pass is scored, which is what produces the reinforcing loop
  # where failures crowd out prevention.
  emergency_charged_to_budget: false

reliability:
  # Customer restoration time by class, in hours — time until the customer is
  # back on, not time until the cable is repaired. A looped feeder is restored
  # by switching and repaired afterwards; a radial lateral's customers are out
  # for the whole job, so the ordering runs opposite to repair difficulty.
  outage_hours_emergency:
    main_feeder: 1.8
    distribution_3ph: 3.0
    lateral_1ph: 5.0
  outage_hours_planned:
    main_feeder: 0.0        # back-fed, no interruption
    distribution_3ph: 0.5   # brief switching
    lateral_1ph: 4.0        # radial: customers out for the work
  # Value of lost load, dollars per customer-hour, by customer type.
  # PLACEHOLDERS needing sourcing to published interruption-cost estimates,
  # with the source and the outage duration they were read at beside them.
  voll_per_customer_hour:
    residential: 8.0
    commercial: 180.0
    industrial: 1400.0

policies:
  - {name: run_to_failure}
  - {name: age_threshold, params: {threshold_years: 45}}
  - {name: risk_ranked,   params: {rank_by: score_per_dollar}}
  - {name: worst_first}
  - {name: random}

reporting:
  baseline_policy: run_to_failure   # what "avoided" is measured against
