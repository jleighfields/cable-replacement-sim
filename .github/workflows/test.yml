name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# No paths: filter. The `test` job below is a required status check, and a
# required check that does not run leaves a pull request permanently
# "expected" — unable to merge and unable to fail.

concurrency:
  group: test-${{ github.ref }}
  # Only cancel superseded pull-request runs. On main a second merge would
  # otherwise cancel the first, and a cancelled required check has to be
  # re-run by hand.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` at the repository root names the version and the
      # components, and the runner ships rustup, so running it inside the
      # checkout installs exactly what that file names. Naming a channel here
      # instead would let the two disagree: the action would install its
      # channel, then cargo would read the file and download a second
      # toolchain on every run.
      - name: Install the pinned Rust toolchain
        # --no-self-update because rustup updates itself by default here, and
        # a job that upgrades its own toolchain manager is the drift this pin
        # exists to stop. The action this step replaced passed the same flag.
        run: rustup install --no-self-update

      # Caches the compiled dependency crates. Without it every run rebuilds
      # them from scratch, which is what makes --release unaffordable.
      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The Rust steps below build PyO3, which resolves an interpreter to
      # build against and refuses one older than the `abi3-py311` feature
      # allows. Without this it silently takes whatever `python3` the runner
      # image happens to ship — 3.12 today, and a failure the day that
      # changes or the job moves to a different image. `.python-version` is
      # what names the interpreter, for uv and for PyO3 alike.
      - name: Provision the interpreter PyO3 builds against
        run: |
          uv python install
          echo "PYO3_PYTHON=$(uv python find)" >> "$GITHUB_ENV"

      - name: Rust format
        run: cargo fmt --check

      - name: Rust lint
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      # --no-default-features drops pyo3/extension-module, which is on by
      # default so maturin builds a loadable module. A test binary linked
      # against it fails to resolve the CPython symbols the interpreter would
      # otherwise supply, so this is a link error rather than a test failure.
      - name: Rust tests
        run: cargo test --no-default-features

      # --locked fails when uv.lock does not match pyproject.toml, instead of
      # resolving something else and testing a dependency set the repo does
      # not claim.
      - name: Install dependencies
        run: uv sync --locked

      # --release because the parity tests run many replications, and a debug
      # build is slow enough that they dominate the job. Any timing measured
      # off a debug build is meaningless besides. PLAN.md section 6 is where a
      # measured ratio belongs, once Phase 5 produces one.
      - name: Build the extension module
        run: uv run maturin develop --release

      - name: Python lint
        run: uv run ruff check .

      # The `notebooks` and `app` markers are excluded by addopts in
      # pyproject.toml. The app suite runs in app.yml, off the pull-request
      # path; the notebook suite runs only when someone runs it.
      - name: Python tests
        run: uv run pytest -n auto
