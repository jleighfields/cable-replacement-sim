name: app

# Playwright integration tests against the running Shiny app. Kept off the
# pull-request path for the same reason as notebooks.yml: a browser run costs
# minutes, and the browser download costs more. Promote it to a required
# check once the app is the deliverable and the run is understood.
#
# NOT a required status check while it runs on a schedule — a scheduled
# workflow cannot report on a pull request.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1"   # Mondays, 07:30 UTC, after notebooks.yml
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  # Never cancel. This workflow has no pull_request trigger, and its run is
  # the only signal this suite produces — a second push to main should queue
  # behind the first rather than discard its result.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group app

      - name: Build the extension module
        run: uv run maturin develop --release

      # Chromium only. The app is not being tested for cross-browser
      # rendering; it is being tested for whether a run completes and the
      # results render. --with-deps pulls the system libraries the headless
      # browser needs, which the runner image does not carry.
      - name: Install Playwright
        run: uv run playwright install --with-deps chromium

      # The app fixture starts the server and tears it down; nothing here
      # assumes a server is already listening.
      # Same reasoning as the notebook run: `pytest -m app` exits 5 when the
      # marker selects nothing. The guard is on the app suite existing, so
      # this job always runs and an empty selection once it does exist is a
      # break rather than the expected state.
      - name: App tests
        run: |
          if ! compgen -G 'tests/app/test_*.py' > /dev/null; then
            echo "::notice::No app tests yet — nothing to run."
            exit 0
          fi
          uv run pytest -m app --tracing=retain-on-failure --screenshot=only-on-failure

      # A failing browser test is close to unreadable without them.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
