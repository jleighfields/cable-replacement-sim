name: app

# Playwright integration tests against the running Shiny app. Kept off the
# pull-request path because a browser run costs minutes and the browser
# download costs more. Promote it to a required check once the app is the
# deliverable and the run is understood.
#
# NOT a required status check while it runs on a schedule — a scheduled
# workflow cannot report on a pull request.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1"   # Mondays, 07:30 UTC
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  # Never cancel. This workflow has no pull_request trigger, and its run is
  # the only signal this suite produces — a second push to main should queue
  # behind the first rather than discard its result.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything the app job does before it reaches the tests is expensive: a
  # release Rust build and a Chromium download, minutes apiece. Deciding here
  # whether there is anything to run means a scheduled run pays for that only
  # once the suite exists. A checkout costs seconds, and a skipped job reads as
  # skipped rather than as a green run that tested nothing.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.suite.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      # Any test file under `tests/app`, at any depth. Not a glob on that
      # directory's immediate children, which would miss a nested one; and not
      # a search for the marker text, which matched the test that builds
      # fixtures containing it and left this answering `true` for a repository
      # with no app tests at all.
      #
      # A cheap gate cannot reproduce what `pytest -m app` collects, so it does
      # not try. It reads the convention — app tests live under `tests/app` —
      # and `test_no_app_test_hides_where_the_gate_cannot_see_it` is what keeps
      # the convention true. The gate and the job agree because that test makes
      # them, not because this line reimplements collection.
      - id: suite
        run: |
          if [ -d tests/app ] && find tests/app -name 'test_*.py' -type f | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No app tests yet — the app job is skipped."
          fi

  app:
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The version comes from `rust-toolchain.toml` at the repository root,
      # which rustup reads inside the checkout.
      - name: Install the pinned Rust toolchain
        # --no-self-update because rustup updates itself by default here, and
        # a job that upgrades its own toolchain manager is the drift this pin
        # exists to stop. The action this step replaced passed the same flag.
        run: rustup install --no-self-update
      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group app

      - name: Build the extension module
        run: uv run maturin develop --release

      # Chromium only. The app is not being tested for cross-browser
      # rendering; it is being tested for whether a run completes and the
      # results render. --with-deps pulls the system libraries the headless
      # browser needs, which the runner image does not carry.
      - name: Install Playwright
        run: uv run playwright install --with-deps chromium

      # The app fixture starts the server and tears it down; nothing here
      # assumes a server is already listening.
      # No guard on the suite existing: the job above this one is that guard,
      # and it decided before any of the setup was paid for. `pytest -m app`
      # exits 5 when the marker selects nothing, and once the files exist an
      # empty selection is a break rather than the expected state.
      - name: App tests
        run: uv run pytest -m app --tracing=retain-on-failure --screenshot=only-on-failure

      # A failing browser test is close to unreadable without them.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
