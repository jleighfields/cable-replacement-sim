name: notebooks

# Executes every marimo notebook headless so they cannot silently rot, and
# runs whichever of them assert on their own results as integration tests.
# Kept off pull requests: five notebooks end to end takes minutes, and a
# notebook breaks when the package API it imports changes — which the merge
# to main surfaces within one run.
#
# NOT a required status check. A scheduled workflow cannot report on a pull
# request, so requiring it would block every merge.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"   # Mondays, 07:00 UTC
  workflow_dispatch:

concurrency:
  group: notebooks-${{ github.ref }}
  # Never cancel. This workflow has no pull_request trigger, and its run is
  # the only signal this suite produces — a second push to main should queue
  # behind the first rather than discard its result.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The version comes from `rust-toolchain.toml` at the repository root,
      # which rustup reads inside the checkout.
      - name: Install the pinned Rust toolchain
        # --no-self-update because rustup updates itself by default here, and
        # a job that upgrades its own toolchain manager is the drift this pin
        # exists to stop. The action this step replaced passed the same flag.
        run: rustup install --no-self-update
      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The notebooks group carries marimo; a plain `uv sync` leaves it out
      # and every notebook then fails on `import marimo`.
      - name: Install dependencies
        run: uv sync --locked --group notebooks

      - name: Build the extension module
        run: uv run maturin develop --release

      # `pytest -m notebooks` exits 5 when the marker selects nothing, which
      # fails the job. Until the notebooks exist there is genuinely nothing to
      # execute, and a red check nobody can act on is a check people learn to
      # ignore. The guard is on the notebooks themselves rather than on the
      # job, so this job always runs and reports: once a notebook exists the
      # suite runs for real, and an empty selection then is a break rather
      # than the expected state.
      - name: Execute notebooks
        run: |
          if ! compgen -G 'notebooks/*.py' > /dev/null; then
            echo "::notice::No notebooks yet — nothing to execute."
            exit 0
          fi
          uv run pytest -m notebooks
